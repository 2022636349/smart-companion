spring.application.name=education-business-service
server.port=8080
server.tomcat.use-relative-redirects=true

# MySQL business data
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/xiaozhi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Internal FastAPI service
education.ai-service.base-url=${AI_SERVICE_URL:http://localhost:8000}
education.ai-service.internal-token=${INTERNAL_SERVICE_TOKEN:local-development-internal-token-2026}
education.ai-service.tutor-read-timeout-seconds=${AI_TUTOR_READ_TIMEOUT_SECONDS:150}
education.ai-service.assessment-read-timeout-seconds=${AI_ASSESSMENT_READ_TIMEOUT_SECONDS:240}
education.business-service.internal-base-url=${BUSINESS_SERVICE_INTERNAL_BASE_URL:http://localhost:8080}
education.knowledge-service.base-url=${KNOWLEDGE_SERVICE_URL:http://localhost:8001}
education.knowledge-service.internal-token=${INTERNAL_SERVICE_TOKEN:local-development-internal-token-2026}

# Browser access. Vite normally proxies /api, but direct local calls are allowed for debugging.
education.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:3000,http://127.0.0.1:3000}

# JWT and refresh-token settings. Override the secret outside local development.
education.security.jwt-secret=${JWT_SECRET:local-development-secret-change-before-deployment-2026}
education.security.access-token-seconds=${ACCESS_TOKEN_SECONDS:1800}
education.security.refresh-token-days=${REFRESH_TOKEN_DAYS:14}

# Optional local demo accounts/classes; disabled unless explicitly enabled.
education.demo-data.enabled=${DEMO_DATA_ENABLED:false}

# File storage
education.file-storage.root=${FILE_STORAGE_ROOT:./storage}
education.file-storage.max-bytes=${MAX_UPLOAD_BYTES:52428800}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:101MB}

# Enable explicitly when applying database migrations.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
education.model-settings.key-file=${MODEL_SETTINGS_KEY_FILE:D:/CodexEnvs/EducationAgent/secrets/model-settings.key}

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
logging.level.root=info
logging.level.com.education.agent=${EDUCATION_LOG_LEVEL:info}
