spring.datasource.url=jdbc:h2:mem:education_agent_test_${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.flyway.enabled=false
education.model-settings.key-file=D:/CodexEnvs/EducationAgent/test-storage/model-settings-test.key

education.security.jwt-secret=test-secret-with-more-than-thirty-two-characters
education.security.access-token-seconds=1800
education.security.refresh-token-days=14
education.demo-data.enabled=false
education.ai-service.base-url=http://127.0.0.1:65530
education.knowledge-service.base-url=http://127.0.0.1:65531
education.ai-service.internal-token=test-internal-token
education.ai-service.assessment-read-timeout-seconds=240
education.knowledge-service.internal-token=test-internal-token
education.business-service.internal-base-url=http://localhost:8080
education.file-storage.root=D:/CodexEnvs/EducationAgent/test-storage
education.file-storage.max-bytes=1048576
education.rate-limit.auth-per-minute=1000
education.rate-limit.feedback-per-minute=1000
education.rate-limit.notification-publish-per-minute=1000
education.rate-limit.report-per-minute=1000
education.rate-limit.ai-per-minute=1000
education.rate-limit.code-per-minute=1000

# Every distinct Spring test context owns an isolated H2 database. Keep durable workers dormant;
# integration tests invoke them explicitly so an older cached context cannot consume a newer
# context's outbox rows or race schema re-initialization.
education.graph-ingestion.scan-ms=3600000
education.graph-ingestion.initial-delay-ms=3600000
education.graph-rollback.scan-ms=3600000
education.graph-rollback.initial-delay-ms=3600000
education.memory.outbox-scan-ms=3600000
education.memory.outbox-initial-delay-ms=3600000
education.profile.summary-scan-ms=3600000
education.profile.summary-initial-delay-ms=3600000

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
logging.level.root=warn
